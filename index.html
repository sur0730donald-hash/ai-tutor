
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI TUTOR | Your Learning Partner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#eaf7ff;font-family:Arial,"Noto Sans JP",sans-serif}
header{padding:22px 18px;border-bottom:1px solid #17364d;background:#0a1929}
.logo{font-size:22px;font-weight:bold;letter-spacing:2px;color:#5ce1ff}
.sub{color:#88a9bd;font-size:12px;margin-top:6px}
main{max-width:850px;margin:auto;padding:20px}
h1{font-size:27px;margin:12px 0}
p{color:#a8c3d5;line-height:1.7}
.panel{background:#0c1d30;border:1px solid #1c4058;border-radius:16px;padding:18px;margin:16px 0}
label{display:block;color:#8edfff;font-size:13px;margin-bottom:8px}
select,textarea,input{width:100%;padding:13px;background:#071523;border:1px solid #28516a;border-radius:10px;color:#fff;font-size:15px}
textarea{min-height:110px;resize:vertical}
button{border:0;border-radius:10px;padding:13px 17px;background:#39cbed;color:#041522;font-weight:bold;font-size:15px;cursor:pointer}
button.secondary{background:#19374d;color:#dff7ff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
#answer{white-space:pre-wrap;line-height:1.9;color:#e6f6ff}
.small{font-size:12px;color:#7fa2b9}
.pill{display:inline-block;padding:6px 10px;border:1px solid #27617b;border-radius:30px;color:#78e4ff;font-size:12px}
footer{text-align:center;padding:25px;color:#63869d;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="logo">✦ AI TUTOR</div>
  <div class="sub">YOUR PERSONAL LEARNING PARTNER</div>
</header>
<main>
  <span class="pill">HIGH SCHOOL LEARNING</span>
  <h1>わからないを、わかるに。</h1>
  <p>質問して、考えて、理解する。あなたの学習をサポートするAI家庭教師。</p>

  <section class="panel">
    <label for="subject">学習する教科</label>
    <select id="subject">
      <option>数学</option>
      <option>英語</option>
      <option>日本史</option>
      <option>地理</option>
      <option>化学</option>
      <option>国語・古典</option>
      <option>情報</option>
      <option>その他</option>
    </select>
    <br><br>
    <label for="level">学習レベル</label>
    <select id="level">
      <option>高校1年生</option>
      <option>高校2年生</option>
      <option>高校3年生</option>
      <option>基礎から学びたい</option>
    </select>
  </section>

  <section class="panel">
    <label for="question">質問や問題を入力</label>
    <textarea id="question" placeholder="例：導関数を使って極大値と極小値を求める方法を教えて！"></textarea>
    <div class="actions">
      <button onclick="askTutor()">質問する ↗</button>
      <button class="secondary" onclick="clearQuestion()">クリア</button>
    </div>
    <p class="small">※ 現在は画面の試作段階です。AIモデル接続後に実際の回答が生成されます。</p>
  </section>

  <section class="panel">
    <label>✦ TUTOR RESPONSE</label>
    <div id="answer">こんにちは！何がわからないか、気軽に質問してね。

教科を選んで質問を入力すると、ここに表示されます。</div>
    <div class="actions">
      <button class="secondary" onclick="speakAnswer()">🔊 読み上げ</button>
      <button class="secondary" onclick="stopSpeech()">停止</button>
    </div>
  </section>
  <footer>AI TUTOR · LEARN AT YOUR OWN PACE</footer>
</main>
<script>
function askTutor(){
  const q=document.getElementById('question').value.trim();
  const s=document.getElementById('subject').value;
  if(!q){document.getElementById('answer').textContent='質問を入力してね！';return;}
  document.getElementById('answer').textContent=
    '選択した教科：'+s+'\n\n質問：'+q+
    '\n\n現在、AIモデルはまだ接続されていません。これは画面の動作確認用です。本物のAIを接続すると、ここで解説を生成できるようになります。';
}
function clearQuestion(){
  document.getElementById('question').value='';
  document.getElementById('answer').textContent='質問を入力してね！';
}
function speakAnswer(){
  if(!('speechSynthesis' in window)){
    alert('このブラウザでは音声読み上げを利用できません。');return;
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(document.getElementById('answer').textContent);
  u.lang='ja-JP';
  speechSynthesis.speak(u);
}
function stopSpeech(){if('speechSynthesis' in window)speechSynthesis.cancel();}
</script>
</body>
</html>
